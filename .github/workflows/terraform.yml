name: Terraform PR Checks

# Runs on every Pull Request that touches infra/ (or this workflow).
# No AWS credentials are needed: the AWS provider runs in plan-only mode
# (mock_credentials = true in the tfvars) and the S3 backend is skipped.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write   # needed to post the plan as a PR comment

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        shell: bash          # bash with pipefail, so `| tee` cannot hide a failed plan
        working-directory: infra/envs/${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff ../..

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -refresh=false -input=false -no-color \
            -var-file=${{ matrix.env }}.tfvars | tee plan.txt

      # Option 1: plan as a downloadable workflow artifact
      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.env }}
          path: infra/envs/${{ matrix.env }}/plan.txt
          if-no-files-found: ignore

      # Option 2: plan as a PR comment (one comment per environment, updated on every push)
      - name: Post plan to PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            const marker = `<!-- terraform-plan-${env} -->`;
            let plan = 'No plan output (an earlier step failed - see the workflow log).';
            const file = `infra/envs/${env}/plan.txt`;
            if (fs.existsSync(file)) plan = fs.readFileSync(file, 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (truncated, see the workflow artifact)';
            const icon = process.env.PLAN_OUTCOME === 'success' ? '✅' : '❌';
            const body = `${marker}\n### ${icon} Terraform plan - \`${env}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
